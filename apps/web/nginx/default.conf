# Serves the Angular SPA and proxies /api to the Jobs API, so the browser talks to a single
# origin (no CORS). Runs as non-root in nginxinc/nginx-unprivileged on port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        # Resolve the upstream at request time so nginx starts even if the API is not up yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://jobs-api:8080;
        # Public by design: this is the browser's only way to reach the API (same origin).
        proxy_pass $api_upstream; # nosemgrep: missing-internal
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundles can be cached forever; index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
