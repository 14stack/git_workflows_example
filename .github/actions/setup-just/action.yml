name: Set up just
description: Installs the pinned version of the `just` command runner (every workflow runs its work through the root justfile).

runs:
  using: composite
  steps:
    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: "1.59.0"
