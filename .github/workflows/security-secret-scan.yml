name: Security · Secret Scan (Gitleaks)

# Scans the entire git history, so a secret that was committed and later deleted is still caught.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Scan git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Scan for secrets
        run: just security-secrets

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-secret-scan
          path: artifacts/security/
          if-no-files-found: ignore
          retention-days: 30
