name: Security · Dependency Scan (Trivy)

# Checks every lockfile (NuGet, uv, npm) against known vulnerabilities. Runs nightly as well,
# because new CVEs are published for dependencies that have not changed.
on:
  pull_request:
    paths:
      - "**/packages.lock.json"
      - apps/jobs-api/Directory.Packages.props
      - apps/ml-worker/uv.lock
      - apps/web/package-lock.json
      - .trivyignore.yaml
      - justfile
      - .github/workflows/security-dependency-scan.yml
  push:
    branches: [main]
    paths:
      - "**/packages.lock.json"
      - apps/jobs-api/Directory.Packages.props
      - apps/ml-worker/uv.lock
      - apps/web/package-lock.json
      - .trivyignore.yaml
      - justfile
      - .github/workflows/security-dependency-scan.yml
  schedule:
    - cron: "41 4 * * *" # daily 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy-fs:
    name: Scan lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Get date for the vulnerability DB cache key
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      - name: Scan dependencies
        run: just security-deps

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dependency-scan
          path: artifacts/security/
          if-no-files-found: ignore
          retention-days: 30
