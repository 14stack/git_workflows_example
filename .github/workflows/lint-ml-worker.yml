name: Lint & Format · ML Worker

on:
  pull_request:
    paths:
      - apps/ml-worker/**
      - justfile
      - .github/actions/setup-ml-worker/**
      - .github/workflows/lint-ml-worker.yml
  push:
    branches: [main]
    paths:
      - apps/ml-worker/**
      - justfile
      - .github/actions/setup-ml-worker/**
      - .github/workflows/lint-ml-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Check formatting, lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-ml-worker

      - name: Lint (ruff format, ruff check, mypy, uv lock)
        run: just worker-lint
