name: Repo · PR Title Check

# PRs are squash-merged, so the PR title becomes the commit message that release-please reads.
# This check keeps titles in Conventional Commits format (see docs/release.md).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            chore
          scopes: |
            api
            worker
            web
            contracts
            deploy
            deps
            deps-dev
            ci
            release
            security
            docs
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter, e.g. "feat(api): add job priority".
