name: Security · Container & IaC Scan (Trivy)

# Builds every image, then scans the Dockerfiles for misconfigurations and the images for
# OS and library CVEs. Runs nightly so base-image CVEs are noticed without a code change.
on:
  pull_request:
    paths:
      - apps/**
      - deploy/**
      - docker-bake.hcl
      - .trivyignore.yaml
      - justfile
      - .github/workflows/security-container-scan.yml
  push:
    branches: [main]
    paths:
      - apps/**
      - deploy/**
      - docker-bake.hcl
      - .trivyignore.yaml
      - justfile
      - .github/workflows/security-container-scan.yml
  schedule:
    - cron: "53 4 * * *" # daily 04:53 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy-images:
    name: Build and scan images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: ./.github/actions/setup-just

      - name: Get date for the vulnerability DB cache key
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      - name: Build images and scan them
        run: just security-images

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-container-scan
          path: artifacts/security/
          if-no-files-found: ignore
          retention-days: 30
