name: E2E Tests · Web (Playwright)

# Builds every image, starts the full docker compose stack and drives the real UI with Playwright:
# browser → nginx → Jobs API → RabbitMQ → ML worker → PostgreSQL.
on:
  pull_request:
    paths:
      - apps/**
      - contracts/**
      - deploy/compose/**
      - justfile
      - .github/actions/setup-web/**
      - .github/workflows/e2e-tests-web.yml
  push:
    branches: [main]
    paths:
      - apps/**
      - contracts/**
      - deploy/compose/**
      - justfile
      - .github/actions/setup-web/**
      - .github/workflows/e2e-tests-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-tests:
    name: Run Playwright tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-web

      - name: Install Playwright browser
        run: just web-e2e-install

      - name: Run end-to-end tests
        run: just web-test-e2e

      - name: Collect stack logs
        if: ${{ failure() }}
        run: just logs-dump

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          check_name: E2E Tests · Web (Playwright)
          junit_files: artifacts/test-results/web-e2e/junit.xml
          check_run: false
          comment_mode: "off"
          compare_to_earlier_commit: false
          job_summary: true

      - name: Upload Playwright report, traces and stack logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tests-web
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack
        if: ${{ always() }}
        run: just reset
